name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: campusmart_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusmart_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/campusmart_test
      # Prisma 7 reads the shadow database from prisma.config.ts (the --shadow-database-url flag is gone).
      # migrate diff wipes it, so it must not be the e2e database; the built-in `postgres` db is throwaway here.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: pnpm run lint --max-warnings 0
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run test:e2e
      # lib/api/schema.d.ts must be current (guide 1.5): regenerate it from the same OpenAPI
      # document /api/docs-json serves and fail on any diff
      - run: pnpm run openapi:export openapi.json
      - name: pnpm run gen:api produces no diff
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm exec openapi-typescript backend/openapi.json -o lib/api/schema.d.ts
          git diff --exit-code lib/api/schema.d.ts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm run build
        env: { API_ORIGIN: http://localhost:4000 }
